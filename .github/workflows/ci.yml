# Имя workflow. Оно отображается в списке на вкладке Actions
name: CI

# Блок "on" отвечает на вопрос: КОГДА запускать этот workflow
on:
  # Событие: кто-то сделал push (отправил коммиты) в репозиторий
  push:
    # Но только если push был в ветку main (если у вас ветка master, замените здесь)
    branches: [master]
  # Событие: открыт или обновлён pull request
  pull_request:
    # Но только если PR направлен в ветку main
    branches: [master]

# Блок "jobs" - список задач. Задачи по умолчанию идут параллельно
jobs:
  # Имя задачи (придумываем сами). Здесь она одна и называется check
  check:
    # На какой виртуальной машине выполнять: свежий Ubuntu от GitHub
    runs-on: ubuntu-latest

    # Шаги внутри задачи. Выполняются строго по порядку, сверху вниз
    steps:
      # Шаг 1: скачать код вашего репозитория на виртуальную машину
      # (она каждый раз пустая, без этого шага кода там просто нет)
      - name: Checkout
        # uses = подключить готовое действие (action) от GitHub; v4 - его версия
        uses: actions/checkout@v4

      # Шаг 2: установить Node.js
      - name: Setup Node
        # Готовое действие, которое ставит нужную версию Node
        uses: actions/setup-node@v4
        # with = параметры для этого действия
        with:
          # Какую версию Node установить
          node-version: 20
          # Кэшировать загруженные npm-пакеты, чтобы следующие запуски шли быстрее
          cache: npm

      # Шаг 3: установить зависимости из package.json
      - name: Install dependencies
        # run = выполнить обычную команду терминала.
        # npm ci ставит зависимости строго по package-lock.json (быстро и без сюрпризов)
        run: npm ci

      # Шаг 4: проверка кода линтером (ESLint)
      - name: Lint
        # Запускает скрипт "lint" из вашего package.json
        run: npm run lint

      # Шаг 5: запуск тестов
      - name: Test
        # "vitest run" выполняет тесты один раз и завершается (без режима слежения).
        # Для этого в package.json добавьте скрипт: "test:run": "vitest run"
        run: npm run test:run

        # Шаг 6: запуск форматирования
      - name: Format
        # "prettier --write ." форматирует код
        run: npm run format:check

      # Шаг 7: проверка, что проект собирается
      - name: Build
        # Запускает "vite build" из вашего package.json
        run: npm run build
